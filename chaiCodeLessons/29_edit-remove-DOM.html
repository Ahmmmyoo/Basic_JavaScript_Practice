// Edit and Remove elements in DOM

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit and Remove elements in DOM</title>
</head>
<body>
  <ul class="list">
    <li>javascript</li>
  </ul>
</body>
<script>

document.body.style.backgroundColor = "#212121"
document.body.style.color = "#f3f3f3"

document.querySelector('ul').setAttribute('className', 'list')

// this function works but isn't optimized as it traverses the entire tree
function addLanguage(langName) {
  const li = document.createElement('li')
  li.innerHTML = `${langName}` // traversing done here...
  document.querySelector('.list').appendChild(li)
}

addLanguage('python')
addLanguage('typescript')

// this is an optimized approach to the function
function addOptiLang(langName) {
  const li = document.createElement('li')
  li.appendChild(document.createTextNode(langName))
  document.querySelector('.list').appendChild(li)
}

addOptiLang('golang')

// Edit
const secondLang = document.querySelector('li:nth-child(2)')
// secondLang.innerHTML = 'Mojo' // not optimized approach
const newLi = document.createElement('li')
newLi.textContent = 'Mojo' // works same as innerHTML
secondLang.replaceWith(newLi)

// Edit
const firstLang = document.querySelector('li:first-child')
firstLang.outerHTML = '<li>TypeScript</li>'

// Remove
const lastLang = document.querySelector('li:last-child')
lastLang.remove()


</script>
</html>
